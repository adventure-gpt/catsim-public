<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="860" height="270" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <g font-size="15" text-anchor="middle">
    <rect x="240" y="12" width="160" height="50" rx="10" fill="#fbfbfb" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="320" y="34" font-weight="600" fill="#333">keys.txt</text>
    <text x="320" y="53" font-size="13" fill="#555">you bring it</text>

    <rect x="20" y="100" width="170" height="90" rx="12" fill="#eef3fb" stroke="#4a6fa5" stroke-width="2"/>
    <text x="105" y="135" font-weight="600" fill="#1d3557">Your Rocket League</text>
    <text x="105" y="157" fill="#333">Steam or Epic,</text>
    <text x="105" y="176" fill="#333">files on disk only</text>

    <rect x="240" y="100" width="160" height="90" rx="12" fill="#fff5e6" stroke="#d98a1c" stroke-width="2"/>
    <text x="320" y="135" font-weight="600" fill="#7a4a00">catsim-dump</text>
    <text x="320" y="157" fill="#333">reads maps, cars, items,</text>
    <text x="320" y="176" fill="#333">never runs the game</text>

    <rect x="450" y="100" width="160" height="90" rx="12" fill="#f1f8ee" stroke="#4f8a3c" stroke-width="2"/>
    <text x="530" y="135" font-weight="600" fill="#2d5a1f">catsim_data/</text>
    <text x="530" y="157" fill="#333">meshes and tables,</text>
    <text x="530" y="176" fill="#333">stays on your PC</text>

    <rect x="660" y="100" width="180" height="90" rx="12" fill="#f5eefb" stroke="#7b4fa5" stroke-width="2"/>
    <text x="750" y="135" font-weight="600" fill="#4a2a6b">import catsim</text>
    <text x="750" y="157" fill="#333">arenas, cars, ball,</text>
    <text x="750" y="176" fill="#333">same API as RocketSim</text>
  </g>
  <g stroke="#555" stroke-width="2" marker-end="url(#a)">
    <line x1="192" y1="145" x2="236" y2="145"/>
    <line x1="402" y1="145" x2="446" y2="145"/>
    <line x1="612" y1="145" x2="656" y2="145"/>
    <line x1="320" y1="64" x2="320" y2="96"/>
  </g>
  <text x="430" y="236" font-size="14" text-anchor="middle" fill="#555">catSim ships no game data and no keys: you make the data once from your own copy of the game.</text>
</svg>
