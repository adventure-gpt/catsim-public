[package]
name = "simbench_catsim"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "simbench worker: catSim's fast engine, native (no Python)"

[[bin]]
name = "simbench-catsim"
path = "src/main.rs"

[dependencies]
simbench_kit = { path = "../kit" }
catsim = { path = "../../../engine/core", features = ["flow"] }
serde_json = "1"

[workspace]

# catSim's own release settings (engine/Cargo.toml)
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
panic = "unwind"
incremental = false
